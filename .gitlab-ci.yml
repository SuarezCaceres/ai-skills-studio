# Pipeline CI/CD para GitLab Pages - ai-skills-studio
image: node:20-alpine

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
    - mv dist public_pages
    - rm -rf public
    - mv public_pages public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
